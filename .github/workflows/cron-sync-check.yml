name: Cron Sync Check

# FIX-4 — drift guard between the cron ROUTES shipped in the image
# (apps/web/src/app/api/cron/*/route.ts) and the host-side SCHEDULE that fires
# them (ops/cron/crontab.fxmily + the ops/cron/fxmily-cron wrapper allowlist).
#
# WHY A CI CHECK RATHER THAN AN SSH PUSH. `deploy.yml` deliberately never touches
# the host cron files — the schedule is host-state, synced by hand via
# `ops/sync-cron-host.sh` (auto-pushing crontab from CI would mutate prod on every
# deploy and could silently enable/disable a destructive purge). So instead of
# touching prod, this job is PURE + READ-ONLY : it fails the PR when a new cron
# route lands in code without its matching crontab line + allowlist entry (the
# exact class of drift that made a route ship-but-never-fire — caught at PR time,
# zero production side-effect). The actual host sync stays a deliberate manual
# `bash ops/sync-cron-host.sh <ssh-host>` step.
#
# The check logic + its unit/integration tests live in
# `scripts/check-cron-crontab-sync.mjs` (+ apps/web/src/lib/cron/crontab-sync.test.ts).

on:
  push:
    branches: [main]
    # Only the three inputs of the check can change the outcome — restrict the
    # trigger to them so the job doesn't burn Actions minutes on unrelated commits.
    paths:
      - 'apps/web/src/app/api/cron/**'
      - 'scripts/check-cron-crontab-sync.mjs'
      - '.github/workflows/cron-sync-check.yml'
      # J9 — the AI worker's own six lists (see the second step below).
      # `ops/**`, not the six worker files. The shell gate below sweeps every
      # executable script under `ops/`, and it used to be reachable only when one
      # of those six changed: 36 of the 42 files it checks — including
      # `fxmily-sync-cron`, which runs as ROOT, and `fxmily-autoheal`, which crond
      # runs as root every hour — could be edited, merged and deployed without the
      # gate ever running. A gate that does not fire on the file it protects is
      # the same false claim it was written to remove.
      - 'ops/**'
      - 'apps/web/src/lib/system/health.ts'
      - 'scripts/check-worker-pipeline-sync.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/app/api/cron/**'
      - 'scripts/check-cron-crontab-sync.mjs'
      - '.github/workflows/cron-sync-check.yml'
      # J9 — the AI worker's own six lists (see the second step below).
      # `ops/**`, not the six worker files. The shell gate below sweeps every
      # executable script under `ops/`, and it used to be reachable only when one
      # of those six changed: 36 of the 42 files it checks — including
      # `fxmily-sync-cron`, which runs as ROOT, and `fxmily-autoheal`, which crond
      # runs as root every hour — could be edited, merged and deployed without the
      # gate ever running. A gate that does not fire on the file it protects is
      # the same false claim it was written to remove.
      - 'ops/**'
      - 'apps/web/src/lib/system/health.ts'
      - 'scripts/check-worker-pipeline-sync.mjs'
  workflow_dispatch:

# Cancel superseded PR runs ; never cancel a `main` run (mirrors ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Strict read-only default — the check only reads files already in the checkout.
permissions:
  contents: read

jobs:
  cron-sync:
    name: Cron routes ↔ crontab in sync
    if: ${{ !(github.event.pull_request && github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Don't persist GITHUB_TOKEN in `.git/config` post-step (zizmor
          # artipacked defense — mirrors ci.yml / deploy.yml).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: Verify cron routes are scheduled + allowlisted
        # Zero dependencies — the script only uses node:fs / node:path, so we
        # skip `pnpm install` entirely and run it straight off the checkout.
        run: node scripts/check-cron-crontab-sync.mjs

      # J9 — the same class of drift, one layer down. The seven AI pipelines are
      # hard-coded in SIX independent files (schedule, two allowlists, watchdog,
      # switchover gate, installer) and nothing compared them. The two failures
      # are asymmetric and both silent: a pipeline SCHEDULED but absent from the
      # watchdog runs unwatched, and a pipeline WATCHED but unscheduled makes the
      # board emit `task_missing:<name>` forever, which is how a board stops
      # being read.
      #
      # The same assertions also run in the Vitest suite
      # (apps/web/src/lib/system/worker-pipeline-sync.test.ts), which is the gate
      # that fires on EVERY pull request. This step is the fast, narrow one: it
      # only triggers when a worker file actually changes, and it prints which
      # of the six lists disagrees and what that costs — which a Vitest diff
      # does not.
      - name: Verify the 7 worker pipelines agree across all six lists
        run: node scripts/check-worker-pipeline-sync.mjs

      # Shell syntax gate. It exists because a comment in `fxmily-sync-cron`
      # justified keeping a fatal check by claiming "CI (bash -n, shellcheck)
      # catches it long before here" — and a grep of `.github/` for
      # `shellcheck|bash -n|shfmt` returned NOTHING. The claim was false on the
      # day it was written, in the very PR that gave those scripts an automatic
      # path to production.
      #
      # It matters more than syntax hygiene: `fxmily-sync-cron` validates a
      # staged script with `head -c 3 | grep '^#!'` plus a size bound, and
      # NEITHER sees a syntax error. Without this gate, a broken wrapper reaches
      # /usr/local/bin and the pipeline that fires every 5 minutes runs it.
      #
      # `bash -n` only — shellcheck is not installed here and claiming its
      # verdict without running it is the mistake this step was born from.
      - name: Shell syntax — every ops script that reaches the host
        run: |
          set -uo pipefail
          FAILED=0
          COUNT=0
          # Built with awk, not a printf escape: a literal CR byte written into THIS
          # file would be the exact defect the step exists to catch.
          CR=$(awk 'BEGIN{printf "%c", 13}')
          # -print0 / read -d '': a path containing a space is split by the default
          # IFS in `for f in $FILES`, and both halves then fail `head` and are skipped
          # WITHOUT incrementing COUNT — a file could leave the sweep by being renamed.
          while IFS= read -r -d '' f; do
            head -c 3 "$f" | grep -q '^#!' || continue   # crontabs and data files
            COUNT=$((COUNT + 1))
            if ! bash -n "$f" 2>&1; then
              echo "::error file=$f::bash -n failed"
              FAILED=1
            fi
            if LC_ALL=C grep -q "$CR" "$f"; then
              echo "::error file=$f::contains CR bytes — cron and bash both break on these"
              FAILED=1
            fi
          done < <(find ops -type f '(' -name '*.sh' -o -name 'fxmily-*' -o -name 'crontab.*' ')' ! -name '*.example' ! -name '*.md' ! -name 'crontab.fxmily*' -print0 | sort -z)
          # Floor set just under the real count (42 at the time of writing), not at a
          # token value. A floor of 8 was worthless: dropping the `*.sh` clause leaves
          # 9 files — 33 of 42 could fall out of the sweep and the step would still
          # pass. An anti-vacuity check whose threshold sits far below the real
          # population does not detect vacuity, it certifies it.
          if [ "$COUNT" -lt 35 ]; then
            echo "::error::only $COUNT shell scripts were checked (expected ~42) — the sweep is broken, not the repo"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$COUNT scripts checked, at least one FAILED (see annotations above)"
            exit 1
          fi
          echo "bash -n + CR check: $COUNT scripts, all clean."

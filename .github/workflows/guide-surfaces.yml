name: Guide surfaces walk

# Ouvre les 24 surfaces membre du GUIDE_CATALOG, en membre authentifié réel, et
# échoue en listant celles qui ne s'ouvrent pas. Deux fois : une fois en
# mouvement normal, une fois avec `prefers-reduced-motion: reduce`.
#
# POURQUOI CE JOB EXISTE
# ----------------------
# Le guide PROMET 24 écrans au membre. Jusqu'ici, rien ne vérifiait qu'ils
# s'ouvrent : la CI teste une poignée de parcours, et le garde de couverture
# (`guide-catalog.test.ts`) compare des listes, jamais des pages. Une surface
# cassée restait donc invisible jusqu'à ce qu'un membre tombe dessus — envoyé
# là par le guide lui-même.
#
# POURQUOI LA NUIT ET PAS SUR CHAQUE PR
# -------------------------------------
# Mesuré : la première compilation Turbopack d'une route coûte 59 s à 2 min. Sur
# 24 routes, à chaque PR, c'est un quart d'heure ajouté au chemin critique de
# tout le dépôt. Le cas fréquent (surface ajoutée sans vignette) est déjà gardé
# à chaque PR par un test Vitest instantané. Ce job couvre l'autre moitié :
# est-ce que les écrans s'ouvrent encore, aujourd'hui.
#
# POURQUOI IL NE RÉGÉNÈRE PAS LES CAPTURES
# ----------------------------------------
# Tentant, et faux. Une capture d'écran n'est pas déterministe d'un OS à
# l'autre : la rasterisation des polices diffère, donc CHAQUE octet diffère
# entre un poste Windows et un runner Linux. Un job « régénère et ouvre une PR
# si ça a changé » ouvrirait une PR de 24 binaires TOUTES LES NUITS, sans qu'un
# seul écran ait bougé. On laisserait ce bruit se fermer tout seul, et on ne
# verrait plus la vraie dérive au milieu. La régénération reste explicite :
# `pnpm --filter @fxmily/web guide:shots`.
#
# NON BLOQUANT PAR CONSTRUCTION : ce workflow n'est pas dans les required checks
# de `main`, au même titre que `e2e-mobile`. C'est un signal, pas une porte.

on:
  workflow_dispatch: {}
  # AJOUT DU 2026-07-30 — une revue adverse a mesuré que ce workflow ne tournait
  # NI sur PR NI sur push : uniquement au cron de 04:00 UTC. Une régression du
  # guide n'était donc vue qu'après merge, sur un run que personne n'est tenu de
  # regarder.
  #
  # Le filtre est étroit À DESSEIN. Faire tourner les 24 surfaces sur toute PR
  # ajouterait un quart d'heure au chemin critique du dépôt (mesuré : 59 s à
  # 199 s de compilation à froid par route), et un job lent qu'on prend
  # l'habitude d'ignorer ne garde rien. On ne déclenche donc que sur les
  # fichiers qui définissent le guide lui-même — ceux dont un changement peut
  # ajouter, retirer ou casser une entrée.
  #
  # ⚠️ CE FILTRE NE COUVRE PAS un composant partagé qui casserait une surface,
  # et rien d'autre ne le couvre non plus sur PR. Une première rédaction de ce
  # commentaire prétendait que `reduced-motion-behaviour.spec.ts` s'en chargeait
  # « dans un check requis » : c'est surestimé. Ce spec ne visite QUE `/mindset`
  # et n'observe qu'un `<line>` décoratif — c'est un canari qui prouve que
  # `useAfterHydration` bascule encore, pas une couverture des 24 surfaces. Un
  # token de `globals.css` ou une `ui/card` qui casse un écran du guide passera
  # donc au vert sur la PR, et ne sera vu qu'au cron de 04:00 UTC.
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/app/guide/**'
      - 'apps/web/tests/e2e/guide-surfaces-walk.spec.ts'
      - 'apps/web/src/test/guide-shot-source.ts'
      - '.github/workflows/guide-surfaces.yml'
  # 04:00 UTC ≈ 05:00–06:00 Europe/Paris — après le nocturne mobile (03:00), pour
  # ne pas se disputer les runners.
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: guide-surfaces
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  walk:
    name: Les 24 surfaces du guide s'ouvrent
    runs-on: ubuntu-latest
    # Généreux à dessein : 24 routes × compilation à froid, et le spec re-visite
    # une surface qui a échoué (le second passage ne paie plus la compilation).
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fxmily
          POSTGRES_PASSWORD: fxmily_dev
          POSTGRES_DB: fxmily
          TZ: Europe/Paris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fxmily -d fxmily"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      HUSKY: 0
      DATABASE_URL: postgresql://fxmily:fxmily_dev@localhost:5432/fxmily?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci_placeholder_secret_must_be_at_least_32_characters_long
      AUTH_TRUST_HOST: 'true'
      VERIFICATION_ADMIN_BATCH_TOKEN: ci_placeholder_verification_admin_batch_token_min_32_chars
      CI: 'true'
      # L'interrupteur du spec (il se saute sans lui — voir son en-tête).
      GUIDE_WALK: '1'
      # Une route froide dépasse largement le défaut CI de 45 s.
      PW_NAV_TIMEOUT: '180000'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (chromium)
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Drop flaky Microsoft apt sources (install-deps NOSPLIT flake)
        run: sudo find /etc/apt/sources.list.d -type f \( -name '*microsoft*' -o -name '*azure*' \) -print -delete

      - name: Install Playwright browsers + system deps (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fxmily/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit branch)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fxmily/web exec playwright install-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @fxmily/web prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @fxmily/web prisma:migrate:deploy

      - name: Walk every guide surface as a real member
        run: pnpm --filter @fxmily/web exec playwright test --project=chromium guide-surfaces-walk.spec.ts

      # DEUXIÈME PASSE — LE MÊME MEMBRE, AVEC `prefers-reduced-motion: reduce`.
      #
      # Ce réglage d'accessibilité système cassait l'hydratation React de six
      # composants (mesuré le 2026-07-30 : `/review`, `/mindset`, `/calendrier`,
      # `/guide`, puis `/objectifs` et `/track` révélés par ce balayage même).
      # La passe en mouvement NORMAL était verte pendant tout ce temps : elle ne
      # pouvait pas voir le défaut, puisqu'il n'existe QUE sous la préférence.
      # D'où cette seconde passe — même spec, un seul interrupteur.
      #
      # `!cancelled()` et non `success()` : sans ça, un échec de la première
      # passe masquerait le résultat de la seconde, et on corrigerait à l'aveugle.
      #
      # Coût réel : le serveur redémarre, mais le cache Turbopack du job est
      # chaud — mesuré en local, 44 s contre 46 s pour la passe froide.
      - name: Walk every guide surface under reduced motion
        if: ${{ !cancelled() }}
        env:
          GUIDE_WALK_REDUCED_MOTION: '1'
        run: pnpm --filter @fxmily/web exec playwright test --project=chromium guide-surfaces-walk.spec.ts

      # RAPPORT DE PÉREMPTION DES VIGNETTES — le « pré-contrôle nocturne » qu'un
      # test nommait déjà sans qu'il existe.
      #
      # `sourceHash` est écrit dans le manifeste par le générateur depuis le
      # scope 2 du J8, et n'était relu par personne : une capture prise avant une
      # refonte de sa route restait en place sans qu'aucun automatisme le dise.
      #
      # `continue-on-error` À DESSEIN, et la mesure le justifie : l'empreinte
      # porte sur les OCTETS des fichiers de la route, donc une JSDoc corrigée la
      # fait bouger autant qu'une refonte (mesuré le 2026-07-30 : 1 capture sur 24
      # signalée, `/guide`, pour un commentaire). En porte dure, ce contrôle
      # exigerait une régénération Playwright complète pour un changement de
      # phrase. Il informe donc, il ne bloque pas — et c'est déjà tout l'écart
      # avec l'état précédent, où rien ne regardait.
      #
      # ⚠️ `github.event_name != 'pull_request'` — AJOUTÉ APRÈS COUP, ET LA PREMIÈRE
      # VERSION SE CONTREDISAIT ELLE-MÊME. L'en-tête du test annonce en toutes
      # lettres « POURQUOI IL NE TOURNE PAS SUR LES PR » ; l'étape, elle, ne
      # portait que `!cancelled()`, donc elle tournait sur toute PR touchant
      # `apps/web/src/app/guide/**` (le filtre de `pull_request` ci-dessus).
      # Pire que contradictoire : le premier chemin déclencheur ci-dessus
      # (`apps/web/src/app/guide/**`) recouvre le dossier propre de la route
      # `/guide`, c'est-à-dire l'empreinte que ce rapport compare. Une PR qui
      # touchait le guide armait donc le rapport ET garantissait son échec —
      # avalé en silence par `continue-on-error`.
      #
      # (Une première rédaction écrivait « ces fichiers-là sont EXACTEMENT ceux
      # qui composent l'empreinte » : faux dans les deux sens. Trois des quatre
      # chemins déclencheurs n'entrent pas dans l'empreinte, et l'empreinte
      # couvre des fichiers du dossier `/guide` que le filtre n'énumère pas.
      # Une justification trop large est aussi fragile qu'une justification
      # absente : elle tombe au premier qui la vérifie.)
      #
      # Le rapport appartient à la nuit.
      - name: Report stale guide thumbnails (informational)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GUIDE_SHOTS_STALENESS: '1'
        run: pnpm --filter @fxmily/web exec vitest run src/app/guide/guide-shots-staleness.test.ts

      - name: Upload Playwright traces + screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-guide-surfaces
          path: apps/web/test-results/
          retention-days: 7

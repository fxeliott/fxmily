name: Quality Checks

# Permanent guardrails turning two recurring CI-red classes into mechanical
# gates (mirrors the pattern of cron-sync-check.yml — pure, read-only, zero-dep):
#
#   • check-no-absolute-dates-in-tests.mjs — a FUTURE-dated literal hard-coded in
#     a test is a time-bomb: green today, red on an arbitrary later date. Fails
#     the PR that introduces a new one (annotate deliberate ones with
#     `// allow-absolute-date`).
#   • check-e2e-copy-sync.mjs — a Playwright spec asserting UI copy that was
#     edited in `src/` (and not updated in the spec) fails as an opaque locator
#     timeout in the 25-min E2E run. Fails the PR at check time with the exact
#     orphaned literal instead.
#   • claude-batch-core.test.sh — deterministic unit tests for the shared
#     local-worker batch core (failure classifier, breaker, invoke wrapper).
#     No network, no real `claude` (mock on PATH) — it was previously run only
#     by hand on the operator's box, so a core regression reached the worker
#     silently (2026-07-08).
#
# All checks read files already in the checkout and have ZERO production
# side-effect. That sentence used to end "(no install), so this job is fast",
# and the rollback drill added below makes it false: the drill pulls
# `node:22-bookworm-slim` from Docker Hub and apt-installs jq/curl/git/tzdata
# inside the container. Anonymous Docker Hub pulls from GitHub-hosted runners
# share a rate limit, so this job now has a network dependency that can flake.
# It stays worth it — the drill is the only thing that ever exercises
# `--uninstall` — but a reader must not believe the job is hermetic. Nothing it
# does touches production either way. The .mjs logic is ALSO enforced
# by the Vitest suite (apps/web/src/lib/quality/*.test.ts) so a coverage run
# catches it too — this standalone workflow gives each failure its own precise
# red signal without needing the full test job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**/*.test.ts'
      - 'apps/web/**/*.test.tsx'
      - 'apps/web/tests/e2e/**'
      - 'apps/web/src/**'
      - 'ops/scripts/**'
      # J9 — `ops/cron/**` and `ops/worker/**` were NOT here, so a PR touching
      # only the watchdog or the switchover gate skipped this job entirely. PR
      # #608 shipped two shell benches under those paths and neither ever ran.
      - 'ops/cron/**'
      - 'ops/worker/**'
      # Prose does not change behaviour, and the drill below pulls a container.
      - '!ops/cron/**.md'
      - '!ops/worker/**.md'
      # Any workflow file, not just this one: a PR that deletes these steps from
      # a sibling workflow would otherwise skip the job that would have noticed.
      - '.github/workflows/**'
      - 'scripts/check-no-absolute-dates-in-tests.mjs'
      - 'scripts/check-e2e-copy-sync.mjs'
      - '.github/workflows/quality-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**/*.test.ts'
      - 'apps/web/**/*.test.tsx'
      - 'apps/web/tests/e2e/**'
      - 'apps/web/src/**'
      - 'ops/scripts/**'
      # J9 — `ops/cron/**` and `ops/worker/**` were NOT here, so a PR touching
      # only the watchdog or the switchover gate skipped this job entirely. PR
      # #608 shipped two shell benches under those paths and neither ever ran.
      - 'ops/cron/**'
      - 'ops/worker/**'
      # Prose does not change behaviour, and the drill below pulls a container.
      - '!ops/cron/**.md'
      - '!ops/worker/**.md'
      # Any workflow file, not just this one: a PR that deletes these steps from
      # a sibling workflow would otherwise skip the job that would have noticed.
      - '.github/workflows/**'
      - 'scripts/check-no-absolute-dates-in-tests.mjs'
      - 'scripts/check-e2e-copy-sync.mjs'
      - '.github/workflows/quality-checks.yml'
  workflow_dispatch:

# Cancel superseded PR runs ; never cancel a `main` run (mirrors ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Strict read-only default — the checks only read files already in the checkout.
permissions:
  contents: read

jobs:
  quality:
    name: Test-suite guardrails
    if: ${{ !(github.event.pull_request && github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    # 5 -> 12: the rollback drill pulls a debian image and runs a full
    # install/uninstall/reinstall cycle. The read-only checks still finish in
    # seconds; this ceiling only has to cover the container step.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Don't persist GITHUB_TOKEN in `.git/config` post-step (zizmor
          # artipacked defense — mirrors ci.yml / deploy.yml / cron-sync-check.yml).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: No future-dated absolute literals in tests
        # Zero dependencies — node:fs / node:path only, no `pnpm install` needed.
        run: node scripts/check-no-absolute-dates-in-tests.mjs

      - name: E2E copy assertions in sync with src
        run: node scripts/check-e2e-copy-sync.mjs

      - name: Local-worker batch core unit tests
        # Deterministic by design: mock `claude` on PATH, no network, no jq/curl.
        run: bash ops/scripts/lib/claude-batch-core.test.sh

      # ── J9 — the two benches that had no runner ────────────────────────────
      # Both were written, committed, and green on one operator's machine. That
      # is not a gate: a test nobody executes cannot go red, which is the exact
      # failure this PR was opened to fix one layer down. Both are pure bash,
      # read only files in the checkout, and carry their own mutation controls.
      - name: Watchdog quota-escalation bench (emitter)
        run: bash ops/cron/fxmily-worker-watchdog.quota.test.sh

      - name: Switchover gate — worker.env reader bench
        # Proves a malformed config line fails LOUDLY and is never echoed: this
        # job's log is public, and sourcing prints the offending line verbatim.
        run: bash ops/worker/verify-worker-vps.envread.test.sh

      - name: Rollback drill (install / uninstall / refuse / reinstall)
        # Runs in a throwaway debian container, never against a real host. It is
        # the only thing that exercises `--uninstall`, the path an operator only
        # ever reaches in an emergency. Docker is preinstalled on ubuntu-latest.
        run: bash ops/worker/rollback-drill.sh

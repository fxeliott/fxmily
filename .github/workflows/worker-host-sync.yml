name: Worker host sync

# Ops workflow — manual trigger only. J9 follow-up.
#
# WHY THIS EXISTS
# ---------------
# J9 put the seven AI pipelines on the app host, and shipped two host-side
# wrappers to run them:
#
#     ops/cron/fxmily-worker            → /usr/local/bin/fxmily-worker
#     ops/cron/fxmily-worker-watchdog   → /usr/local/bin/fxmily-worker-watchdog
#
# J9 shipped those two files with NO path to the host: `deploy.yml` scp'd an
# explicit list that did not name them, and `fxmily-sync-cron`'s MANAGED_SCRIPTS
# table did not either. So J9 created a fresh instance of the exact failure class
# the repo has already been bitten by twice — a file that is IaC in the repo and
# drifts on the host with nothing watching:
#
#   * tour 14: docker-compose.prod.yml lived in the repo, never reached the
#     host, and the uploads volume mount went missing (data loss).
#   * 2026-07-29: ops/caddy/Caddyfile, same shape — which is why
#     `sync-caddy-prod.yml` exists. This workflow is its sibling.
#
# It is not hypothetical here. PRs #580 and #581 changed
# `ops/cron/fxmily-worker-watchdog` (observation-aware labels, and the `:-1`
# default that stops a healthy host from being reported as logged out). Those
# fixes were on `main` and NOT on the host, and no gate said so.
#
# WHAT CHANGED, AND WHAT THIS WORKFLOW IS STILL FOR
# -------------------------------------------------
# The wrappers now travel with the deploy: they are in `deploy.yml`'s `source:`
# list and in the `MANAGED_SCRIPTS` table of `fxmily-sync-cron`, the one command
# `fxmily` may run as root. That is the automatic channel, and it needed two
# filenames and two rows — not a workflow.
#
# What a deploy still cannot do, and this can:
#
#   * MEASURE. Nothing else answers "what is actually running over there?"
#     without an interactive SSH session. Section B compares the installed
#     wrappers to what the last deploy staged — exactly the check that would
#     have caught the #580/#581 drift on the day it happened.
#   * MOVE THE CHECKOUT. `~/worker` is what `fxmily-worker` actually EXECUTES
#     (run-batch.sh and the seven batch scripts live there) and NO deploy touches
#     it. `converge` is the only automated thing that does.
#   * Prove the switchover gate (`verify`) without a human on the box.
#
# The convergence itself is a plain `git` in the fxmily-owned checkout — the repo
# is public, so no credential is involved.
#
# ⚠️ THIS REPOSITORY IS PUBLIC, SO THESE RUN LOGS ARE PUBLIC.
# That is a hard constraint on every line below, not a note:
#   * no token VALUE is ever printed — only key names and lengths ;
#   * `claude auth status` is reduced to its `.loggedIn` boolean. The full JSON
#     carries the account e-mail, which is personal data (§21.5) ;
#   * `status.json` is read field by field. It carries an `account` field, which
#     is never one of them ;
#   * the per-batch `*.wrapper.log` transcripts are NEVER tailed — they contain
#     member content. Only `/var/log/fxmily/worker.log`, the one-line-per-tick
#     timeline, whose line shape is designed to be PII-free ;
#   * every printed line goes through `redact()`, which strips URLs — a blank
#     Healthchecks.io ping URL is inert today, but a populated one is a
#     capability token and curl writes its errors into that very log ;
#   * the host name and IP live in `secrets.HETZNER_HOST` and are never echoed.
#
# SAFETY MODEL
# ------------
#   * `inspect` (default) changes NOTHING about what runs on the host: no file
#     is installed, no schedule touched, no container restarted, no batch
#     started. It is not literally write-free — it runs `git fetch`, which
#     writes objects into the checkout's own `.git` — and saying "writes
#     nothing" would be the kind of imprecision this repo has been bitten by.
#     Always run this mode first.
#   * `converge` fast-forwards the checkout (refusing a dirty tree), then
#     reports the wrapper drift. Installing the wrappers needs root, and the
#     `fxmily` sudoers grant is exactly one command with no arguments
#     (`/usr/local/bin/fxmily-sync-cron`, granted at the `sudo` call in
#     deploy.yml) — so this mode
#     PROBES for the right to run the installer and, when it does not have it,
#     prints the one root command to run and fails loudly rather than pretending
#     the drift is closed.
#   * `verify` runs the read-only 7-pipeline dry-run. It never persists.
#   * No mode ever touches /etc/cron.d/fxmily-app, restarts a container, or
#     writes outside the paths the J9 installer already owns.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = measure (safe) | converge = git pull + install wrappers | verify = start the 7-pipeline dry-run (detached) | verify-status = read a sweep already running'
        required: true
        type: choice
        options:
          - inspect
          - converge
          - verify
          - verify-status
        default: inspect

permissions: {}

concurrency:
  group: worker-host-sync
  cancel-in-progress: false

jobs:
  sync:
    name: ${{ inputs.mode }} worker on prod host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH → ${{ inputs.mode }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: fxmily
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 40m
          envs: MODE
          script: |
            set -uo pipefail

            WORKER_REPO="$HOME/worker"
            WORKER_ENV="$WORKER_REPO/ops/worker/worker.env"
            LOG_DIR="$WORKER_REPO/ops/worker/logs"
            CRON_FILE=/etc/cron.d/fxmily-worker
            CRON_ENV=/etc/fxmily/cron.env
            BIN_WORKER=/usr/local/bin/fxmily-worker
            BIN_WATCHDOG=/usr/local/bin/fxmily-worker-watchdog
            TIMELINE=/var/log/fxmily/worker.log
            # Where `deploy.yml` drops the ops scripts before calling the one
            # command this user may run as root. Since the two wrappers joined
            # that payload, this directory — not the checkout — holds the most
            # recent copy that `main` actually delivered to this machine.
            STAGE_DIR="$HOME/cron-sync"

            # PUBLIC LOG GUARD. Everything printed from host state goes through
            # this. A URL in a log line is not decoration: `hc_ping` appends curl
            # errors to the timeline, and a populated Healthchecks.io URL is a
            # capability token that would then be public forever.
            redact() { sed -E 's#https?://[^[:space:]]+#<url-redacted>#g'; }

            FAILED=0
            # Initialised UP FRONT, not inside the branch that computes them.
            # Section A only reaches the `git status` line when a checkout
            # exists; on a host where it does not, `converge` then read `$DIRTY`
            # under `set -u` and the script died on an unbound variable instead
            # of printing the diagnosis it had just gathered. A guard that
            # crashes before it can report is worse than no guard.
            DIRTY=0
            HAS_CHECKOUT=0
            ok()   { printf '  [OK]   %s\n' "$*"; }
            warn() { printf '  [WARN] %s\n' "$*"; }
            bad()  { printf '  [FAIL] %s\n' "$*"; FAILED=1; }

            # =================================================================
            # A. Checkout — the thing `git pull` converges
            # =================================================================
            echo "::group::A · Dedicated checkout"
            if [ ! -d "$WORKER_REPO/.git" ]; then
              bad "no checkout at ~/worker — run ops/worker/install-worker-vps.sh as root first"
            else
              HAS_CHECKOUT=1
              HEAD_SHA="$(git -C "$WORKER_REPO" rev-parse HEAD 2>/dev/null || echo unknown)"
              echo "  local HEAD : $HEAD_SHA"
              git -C "$WORKER_REPO" log --oneline -1 2>/dev/null | redact
              # `git fetch` is read-only on the working tree: safe in inspect.
              if git -C "$WORKER_REPO" fetch --quiet origin main 2>/dev/null; then
                REMOTE_SHA="$(git -C "$WORKER_REPO" rev-parse FETCH_HEAD)"
                echo "  origin/main: $REMOTE_SHA"
                if [ "$HEAD_SHA" = "$REMOTE_SHA" ]; then
                  ok "checkout is at origin/main"
                else
                  BEHIND="$(git -C "$WORKER_REPO" rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo '?')"
                  warn "checkout is $BEHIND commit(s) BEHIND origin/main"
                fi
              else
                bad "git fetch failed (network, or the clone has no usable origin)"
              fi
              DIRTY="$(git -C "$WORKER_REPO" status --porcelain 2>/dev/null | grep -vE '^\?\?' | wc -l)"
              [ "$DIRTY" -eq 0 ] && ok "working tree clean (tracked files)" \
                                 || warn "$DIRTY tracked file(s) locally modified — converge will refuse"
            fi
            echo "::endgroup::"

            # =================================================================
            # B. Wrapper drift — the whole reason this workflow exists
            # =================================================================
            # There are now TWO sources for /usr/local/bin/fxmily-worker*, and
            # comparing against the wrong one inverts the verdict:
            #
            #   · $STAGE_DIR — what the LAST DEPLOY delivered from `main`, and
            #     what `fxmily-sync-cron` installed from. This is the reference
            #     for "is the host running the merged wrapper?".
            #   · $WORKER_REPO — the checkout, which NO deploy touches. It is
            #     only moved by `converge` (or by hand). It is the reference for
            #     a different question, and one that matters just as much:
            #     `fxmily-worker` EXECUTES `$WORKER_REPO/ops/worker/run-batch.sh`
            #     and the seven batch scripts. A current wrapper on top of a
            #     stale checkout ships half of a coupled change.
            #
            # Comparing only against the checkout — as this section did when the
            # deploy did not carry the wrappers — would report "DRIFTED, the host
            # is not running main" on a host that is EXACTLY at main, the moment
            # a deploy lands a wrapper fix. That is the inverse of the truth, and
            # a red-by-default gate stops being read.
            echo "::group::B · Wrapper drift (host vs last deploy, and the checkout)"
            DRIFT=0
            STALE_CHECKOUT=0
            for pair in "fxmily-worker:$BIN_WORKER" \
                        "fxmily-worker-watchdog:$BIN_WATCHDOG"; do
              NAME="${pair%%:*}"
              DST="${pair##*:}"
              SRC_REPO="$WORKER_REPO/ops/cron/$NAME"
              SRC_STAGED="$STAGE_DIR/$NAME"

              if [ ! -f "$DST" ]; then
                bad "$NAME: NOT INSTALLED on the host"
                DRIFT=1
                continue
              fi

              # The authoritative comparison, when the deploy payload is there.
              if [ -f "$SRC_STAGED" ]; then
                if cmp -s "$SRC_STAGED" "$DST"; then
                  ok "$NAME: matches the last deploy ($(stat -c '%a %U:%G' "$DST"))"
                else
                  bad "$NAME: DRIFTED — the installed copy is not what the last deploy staged"
                  echo "         installed $(stat -c '%y' "$DST" | cut -d. -f1), $(wc -l <"$DST") lines"
                  echo "         staged    $(stat -c '%y' "$SRC_STAGED" | cut -d. -f1), $(wc -l <"$SRC_STAGED") lines"
                  echo "         → the root operator has not re-installed fxmily-sync-cron yet (it never installs itself),"
                  echo "           or something wrote /usr/local/bin outside the deploy."
                  DRIFT=1
                fi
              else
                # No payload on disk: either the deploy predates the two wrappers
                # joining `source:`, or the scp landed elsewhere. Say so rather
                # than silently falling back and calling it a clean result.
                warn "$NAME: no deploy payload at $SRC_STAGED — falling back to the checkout"
                if [ ! -f "$SRC_REPO" ]; then
                  bad "$NAME: missing from the checkout too — nothing to compare against"
                  DRIFT=1
                elif cmp -s "$SRC_REPO" "$DST"; then
                  ok "$NAME: identical to the checkout"
                else
                  bad "$NAME: DRIFTED — host copy differs from the checkout"
                  DRIFT=1
                fi
              fi

              # Second, independent question: is the checkout in step? Not a
              # DRIFT (the wrapper on the host may be perfectly current), but the
              # batch scripts come from here, so it is never "nothing".
              # Skipped when the verdict above was ALREADY based on the checkout
              # (the no-payload fallback): saying the same thing twice in two
              # wordings is how a report stops being read.
              if [ -f "$SRC_STAGED" ] && [ -f "$SRC_REPO" ] && ! cmp -s "$SRC_REPO" "$DST"; then
                warn "$NAME: the CHECKOUT differs from the installed copy — run converge (batch scripts come from ~/worker)"
                STALE_CHECKOUT=1
              fi
            done
            echo "::endgroup::"

            # =================================================================
            # C. Schedule
            # =================================================================
            echo "::group::C · /etc/cron.d/fxmily-worker"
            if [ ! -r "$CRON_FILE" ]; then
              bad "$CRON_FILE missing or unreadable"
            else
              PERMS="$(stat -c '%a' "$CRON_FILE")"
              CR="$(tr -cd '\r' <"$CRON_FILE" | wc -c)"
              ROWS="$(grep -cE '^[0-9*]' "$CRON_FILE" || true)"
              [ "$PERMS" = 644 ] && ok "mode 0644" || bad "mode $PERMS — crond ignores group/other-writable files"
              [ "$CR" -eq 0 ]    && ok "0 CR byte"  || bad "$CR CR byte(s) — crond skips those lines SILENTLY"
              [ "$ROWS" -eq 8 ]  && ok "8 rows (7 pipelines + watchdog)" || bad "$ROWS rows, expected 8"
              for p in onboarding verification seances calendar weekly monthly profile; do
                grep -qE "fxmily-worker[[:space:]]+${p}([[:space:]]|$)" "$CRON_FILE" \
                  || bad "no schedule row for '$p'"
              done
              grep -q 'fxmily-worker-watchdog' "$CRON_FILE" || bad "no watchdog row"
            fi
            # The 25 app rows must be untouched — J9's rollback proof depends on it.
            if [ -r /etc/cron.d/fxmily-app ]; then
              ok "/etc/cron.d/fxmily-app: $(grep -cE '^[0-9*]' /etc/cron.d/fxmily-app) rows (worker never touches this file)"
            fi
            echo "::endgroup::"

            # =================================================================
            # D. Observation switch + config (NO VALUES, ever)
            # =================================================================
            echo "::group::D · Mode + config"
            if [ ! -r "$CRON_ENV" ]; then
              bad "$CRON_ENV unreadable"
            elif grep -qE '^FXMILY_WORKER_DRY_RUN=' "$CRON_ENV"; then
              # This key's value is a mode flag (0/1), not a secret.
              DRY="$(grep -E '^FXMILY_WORKER_DRY_RUN=' "$CRON_ENV" | tail -1 | cut -d= -f2 | tr -d '"'"'"' \r')"
              if [ "$DRY" = "1" ]; then
                ok "FXMILY_WORKER_DRY_RUN=1 → OBSERVATION (server persists nothing, PC is master)"
              else
                warn "FXMILY_WORKER_DRY_RUN=$DRY → PRODUCTION (server persists)"
              fi
            else
              bad "$CRON_ENV declares no FXMILY_WORKER_DRY_RUN (observation window not armed)"
            fi
            if [ -r "$WORKER_ENV" ]; then
              # Lengths only. A length cannot reconstruct a token.
              N_OK=0
              for k in FXMILY_ADMIN_TOKEN FXMILY_MONTHLY_ADMIN_TOKEN FXMILY_CALENDAR_TOKEN \
                       FXMILY_VERIFICATION_ADMIN_BATCH_TOKEN FXMILY_PROFILE_ADMIN_TOKEN FXMILY_SEANCES_TOKEN; do
                LEN="$(awk -F= -v k="$k" '$1==k {print length($2)}' "$WORKER_ENV" | head -1)"
                if [ -n "$LEN" ] && [ "$LEN" -ge 32 ]; then N_OK=$((N_OK + 1)); else bad "$k missing or <32 chars"; fi
              done
              ok "$N_OK/6 pipeline tokens present and >=32 chars (lengths only, never values)"
              ok "worker.env mode $(stat -c '%a %U:%G' "$WORKER_ENV")"
            else
              bad "worker.env unreadable at ~/worker/ops/worker/worker.env"
            fi
            # The EXTERNAL alert channel — counted, because "wired" and "armed"
            # have looked identical from the outside since J9 shipped.
            #
            # Every hop of the primary alert path runs inside the app: the
            # watchdog POSTs a heartbeat to it, `/api/cron/health` reads it, and
            # `cron-watch.yml` polls that. An app that is down cannot report that
            # it is down. Healthchecks.io is the only channel that survives that,
            # and its seven URLs ship BLANK — a blank URL makes the wrapper skip
            # the ping silently, which is correct behaviour and invisible state.
            #
            # A count, never a value: a populated ping URL is a capability token
            # (whoever holds it can mark the check "up" and silence the alarm)
            # and this log is public. `redact()` would catch it, but relying on a
            # filter to strip a secret we chose to print is not a design.
            HC_TOTAL=0
            HC_SET=0
            for k in ONBOARDING VERIFICATION SEANCES CALENDAR WEEKLY MONTHLY PROFILE; do
              HC_TOTAL=$((HC_TOTAL + 1))
              # Non-empty AND not a placeholder: `=` alone, or a value that is
              # not a URL, both mean "not armed" and both have shipped as one.
              # SHAPE, not length. A length test counts `TODO-fill-this-in-later`
              # as armed and reports 7/7 on a dead-man switch that is dead — the
              # exact failure mode a dead-man switch exists to rule out. `awk`
              # tests the prefix and prints a bare 1: the VALUE never leaves awk,
              # so a ping URL still cannot reach this public log.
              VAL="$(awk -F= -v k="HEALTHCHECK_PING_URL_WORKER_$k" \
                     '$1==k && $2 ~ /^https:\/\/[^[:space:]]+$/ && length($2) >= 20 {print 1}' \
                     "$CRON_ENV" 2>/dev/null | head -1)"
              [ "$VAL" = "1" ] && HC_SET=$((HC_SET + 1))
            done
            if [ "$HC_SET" -eq "$HC_TOTAL" ]; then
              ok "$HC_SET/$HC_TOTAL external ping URLs configured (values never printed)"
            elif [ "$HC_SET" -eq 0 ]; then
              warn "0/$HC_TOTAL external ping URLs configured — the app is the ONLY alert channel,"
              warn "so an app that is down cannot tell you the worker is down. See RUNBOOK.md"
              warn "§ 'external dead-man switch' for the seven-step arming procedure."
            else
              warn "$HC_SET/$HC_TOTAL external ping URLs configured — a PARTIAL channel is the"
              warn "worst of the three states: it looks armed and covers only some pipelines."
            fi
            echo "::endgroup::"

            # =================================================================
            # E. Claude session — the ONE boolean, never the account identity
            # =================================================================
            echo "::group::E · Claude session"
            export PATH="$HOME/.npm-global/bin:$HOME/bin:$PATH"
            if ! command -v claude >/dev/null 2>&1; then
              bad "claude CLI not on PATH for the fxmily user"
            else
              ok "claude $(claude --version 2>&1 | head -1)"
              # `.loggedIn` ONLY. The full payload names the account.
              LOGGED="$(claude auth status --json 2>/dev/null | jq -r '.loggedIn // false' 2>/dev/null || echo false)"
              if [ "$LOGGED" = "true" ]; then
                ok "a Claude account is signed in → the pipelines can generate"
              else
                warn "no Claude account signed in → every tick is a benign, free skip"
                warn "this is the EXPECTED state during un-authenticated observation"
              fi
            fi
            echo "::endgroup::"

            # =================================================================
            # F. Did it actually run? (status.json, field by field)
            # =================================================================
            echo "::group::F · Last run per pipeline"
            NOW="$(date -u +%s)"
            for p in onboarding verification seances calendar weekly monthly profile; do
              F="$LOG_DIR/${p}.status.json"
              if [ ! -r "$F" ]; then
                printf '  %-13s no status file yet\n' "$p"
                continue
              fi
              AGE=$(( (NOW - $(stat -c '%Y' "$F")) / 60 ))
              # Named fields only — `.account` is deliberately not among them.
              printf '  %-13s age=%smin ok=%s exit=%s skipped=%s capped=%s\n' "$p" "$AGE" \
                "$(jq -r '.ok // "?"'          "$F" 2>/dev/null)" \
                "$(jq -r '.exitCode // "?"'    "$F" 2>/dev/null)" \
                "$(jq -r '.skipped // "-"'     "$F" 2>/dev/null)" \
                "$(jq -r '.quotaCapped // "-"' "$F" 2>/dev/null)"
            done
            echo "::endgroup::"

            # =================================================================
            # F-bis. Did it PRODUCE anything? — J9 "Done quand" #2
            # =================================================================
            # Section F answers "did the batch run?". It cannot answer "did the
            # batch make anything?", and the difference between those two is the
            # single failure mode this jalon exists to remove: a pipeline that
            # pulls its envelope (so the age heartbeat goes green), calls nothing,
            # persists nothing, and reports ok=true. `status.json` records
            # exitCode / ok / quotaCapped / skipped — not one field about output.
            #
            # The numbers DO exist: every pipeline prints a production summary.
            # They live in `<batch>.log`, which this workflow has never touched
            # and must never tail, because that file carries member content and
            # these run logs are PUBLIC.
            #
            # SO THE RULE HERE IS ABSOLUTE, AND IT IS ENFORCED BY CONSTRUCTION,
            # NOT BY CARE: every character printed by this section comes either
            # from a literal written in this file, or from `[0-9]+`. `grep -oE`
            # emits only what its pattern matched, and every pattern below is a
            # fixed string with digit classes punched into it. There is no branch
            # where a byte of member text can reach stdout — not via a filename,
            # not via an error message, not via a partially-matched line.
            #
            # Scoped to the LAST run, not to the file: `<batch>.log` is
            # append-only across runs (pruned at 14 days), so an unscoped grep
            # would happily report a generation from six days ago as if it were
            # this morning's. `run-batch.sh` writes `[worker] batch=<b> started=`
            # at the top of every run — that marker is the section boundary.
            echo "::group::F-bis · What the last run actually produced (numbers only)"
            for p in onboarding verification seances calendar weekly monthly profile; do
              BLOG="$LOG_DIR/${p}.log"
              if [ ! -r "$BLOG" ]; then
                printf '  %-13s no batch log yet\n' "$p"
                continue
              fi
              # Byte-scope to the last run. `+N` is a line number, so a log with
              # no marker at all (a very old file) falls back to line 1 rather
              # than to an empty tail — reporting "nothing found" on a file that
              # may hold something is a lie by omission.
              MARK="$(grep -n "^\[worker\] batch=${p} started=" "$BLOG" 2>/dev/null | tail -1 | cut -d: -f1)"
              SECTION="$(tail -n "+${MARK:-1}" "$BLOG" 2>/dev/null)"
              # HOW OLD are these numbers? This section is headed "the LAST run",
              # and without this line that heading is false in the one situation
              # it matters most.
              #
              # `run-batch.sh` writes the scope marker at line 465 — AFTER all
              # eight benign pre-flight skips (quota cooldown, logged out, wrong
              # account, lock held). So a skipped tick appends NOTHING to this
              # log while still refreshing `status.json`. During a quota outage —
              # exactly the failure this workflow now exists to reveal — section
              # F shows a fresh `status.json` and this section would show the
              # generation counts of the last run that really ran, possibly days
              # old, with no qualifier whatsoever. An adversarial review found
              # this by EXECUTION, three times independently, while the comment
              # above claimed to prevent it.
              #
              # The age comes from `stat`, a number this workflow computes — no
              # byte of the log is involved, so the digits-only property holds.
              LOG_AGE_MIN=$(((NOW - $(stat -c '%Y' "$BLOG" 2>/dev/null || echo "$NOW")) / 60))
              # Every pattern: literal + [0-9]+. Nothing else can survive `-oE`.
              EVIDENCE="$(printf '%s' "$SECTION" | grep -oE \
                -e 'Generated: [0-9]+, errored: [0-9]+' \
                -e 'skipped inactive: [0-9]+' \
                -e 'skipped \(no questionnaire\): [0-9]+' \
                -e 'already generated \(resume\): [0-9]+' \
                -e 'Payload: [0-9]+ bytes / [0-9]+ entries' \
                -e 'held complete=[0-9]+' \
                -e 'awaiting media=[0-9]+' \
                -e 'awaiting AI=[0-9]+' \
                -e '"(total|persisted|created|updated|skipped|failed|errors|unchanged)": [0-9]+' \
                2>/dev/null | tail -8 | tr '\n' ' ' | tr -s ' ')"
              if [ -n "$EVIDENCE" ]; then
                # The age FIRST. An operator who reads left to right must meet
                # "written 4320 min ago" before meeting "Generated: 26".
                printf '  %-13s [written %smin ago] %s\n' "$p" "$LOG_AGE_MIN" "$EVIDENCE"
              else
                # Not a failure. Three legitimate causes, and the operator must
                # not read this as "broken": an empty cohort, a dry-run
                # short-circuit, or a pipeline whose summary shape is not in the
                # whitelist above. Saying which is impossible from numbers alone.
                printf '  %-13s last run printed no production number\n' "$p"
              fi
            done
            echo "::endgroup::"

            echo "::group::G · Root reach (can converge finish by itself?)"
            # Answer this BEFORE someone runs converge, not after it fails at the
            # last step. The grant is command-specific (see the comment above
            # the `sudo` call in deploy.yml), so
            # `sudo -n true` is a faithful proxy: if a bare command is refused,
            # so is the installer. `-n` never prompts, so this cannot hang.
            if sudo -n true 2>/dev/null; then
              ok "passwordless sudo available → mode=converge can install the wrappers itself"
            else
              warn "no general sudo for this user → mode=converge will stop at the wrapper install"
              warn "and print the single root command to run. Expected: the sudoers grant is"
              warn "limited to fxmily-sync-cron with no arguments."
            fi
            # NOT `sudo -n -l`. Its output opens with "Matching Defaults entries
            # for fxmily on <hostname>:" — it prints the machine's name, in a log
            # that is PUBLIC because this repository is. GitHub only masks an
            # EXACT match of a secret's value, and `secrets.HETZNER_HOST` holds
            # the address, not the short hostname, so nothing would redact it.
            # The boolean above answers the only question this section asks, and
            # the grant itself is already documented above the `sudo` call in
            # deploy.yml.
            echo "::endgroup::"

            echo "::group::H · Timeline (last 25 ticks, redacted)"
            # The one-line-per-tick log ONLY. Never the *.wrapper.log transcripts.
            [ -r "$TIMELINE" ] && tail -25 "$TIMELINE" | redact || echo "  (no $TIMELINE yet)"
            echo "::endgroup::"

            if [ "$MODE" = "inspect" ]; then
              echo
              # Two DIFFERENT problems, two different sentences. Collapsing them
              # into one "drift" message is how a gate ends up telling an
              # operator the opposite of what is wrong.
              [ "$DRIFT" -eq 1 ] && echo "::warning title=Wrapper drift::an installed wrapper does not match what the last deploy staged. A root operator must re-install fxmily-sync-cron (it never installs itself), then re-run a deploy."
              [ "$STALE_CHECKOUT" -eq 1 ] && echo "::warning title=Stale checkout::~/worker is behind the installed wrappers. The batch scripts run FROM that checkout — re-run with mode=converge."
              echo "inspect mode — nothing was written."
              [ "$FAILED" -eq 0 ] && echo "RESULT: no failure detected." || echo "RESULT: at least one check FAILED (above)."
              exit "$FAILED"
            fi

            # =================================================================
            # VERIFY — the read-only 7-pipeline dry-run (Done-quand #1)
            # =================================================================
            # =================================================================
            # VERIFY — the read-only 7-pipeline dry-run (Done-quand #1)
            # =================================================================
            # WHY THIS IS DETACHED AND NOT A PLAIN CALL, measured 2026-08-06.
            #
            # The plain call was `bash verify-worker-vps.sh 2>&1 | redact`. Run
            # 31111894121 hit `Run Command Timeout` at 40 minutes and printed
            # ZERO per-pipeline verdicts. Two independent faults, and the second
            # is the one that matters:
            #
            #   1. 40 minutes is far below an honest sweep. Seven pipelines run
            #      SERIALLY behind the machine-global lock, each member costs a
            #      jittered sleep with a 30 s floor (that floor IS the anti-ban
            #      design) plus a real model call for the four generators. A
            #      thirty-member cohort is hours, not minutes.
            #   2. Nothing streamed. `printf` to a pipe is block-buffered, and
            #      `sed` buffers again, so the whole transcript died with the
            #      session. The switchover gate spent forty minutes of REAL
            #      quota on the dedicated account and produced no evidence at
            #      all — a gate that can consume and never report.
            #
            # So the sweep now outlives the SSH session (`setsid` + `nohup`), is
            # line-buffered into a log on the host, and this step TAILS it. A run
            # that ends without a verdict is reported as "no verdict", never as a
            # pass: the absence of a result must not be readable as a result.
            VERIFY_DIR="$LOG_DIR/verify"
            VERIFY_PID_FILE="$VERIFY_DIR/current.pid"
            VERIFY_PTR="$VERIFY_DIR/current.path"

            if [ "$MODE" = "verify" ] || [ "$MODE" = "verify-status" ]; then
              mkdir -p "$VERIFY_DIR"
              RUNNING=0
              if [ -r "$VERIFY_PID_FILE" ]; then
                VPID="$(tr -dc '0-9' <"$VERIFY_PID_FILE")"
                [ -n "$VPID" ] && kill -0 "$VPID" 2>/dev/null && RUNNING=1
              fi
            fi

            if [ "$MODE" = "verify" ]; then
              # Refuse to start a SECOND sweep. Two concurrent sweeps would
              # queue on the machine-global lock and double the quota spend for
              # one verdict — and the second would look like it hung.
              if [ "$RUNNING" -eq 1 ]; then
                echo "::error title=A sweep is already running::pid $VPID. Read it with mode=verify-status instead of starting a second one."
                exit 1
              fi
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              VLOG="$VERIFY_DIR/verify-$STAMP.log"
              : >"$VLOG"
              printf '%s\n' "$VLOG" >"$VERIFY_PTR"
              # `stdbuf -oL` so a line is readable the moment it is printed;
              # `setsid` so the sweep survives this SSH session ending.
              nohup setsid stdbuf -oL bash "$WORKER_REPO/ops/worker/verify-worker-vps.sh" \
                >"$VLOG" 2>&1 </dev/null &
              printf '%s\n' "$!" >"$VERIFY_PID_FILE"
              VPID="$(cat "$VERIFY_PID_FILE")"
              echo "sweep started detached (pid $VPID) — it survives this session."
              RUNNING=1
            fi

            if [ "$MODE" = "verify" ] || [ "$MODE" = "verify-status" ]; then
              VLOG="$(cat "$VERIFY_PTR" 2>/dev/null)"
              if [ -z "$VLOG" ] || [ ! -r "$VLOG" ]; then
                echo "::error title=No sweep to read::no verify log on this host yet. Run mode=verify first."
                exit 1
              fi
              # FRESHNESS OF THE VERDICT, and it is the whole point of the mode.
              # Without it `verify-status` follows the pointer, finds last week's
              # `RESULT: 7/7 pass`, replays the transcript byte-for-byte and exits
              # 0 — a green tick in Actions, on a host where nothing ran, startable
              # by anyone through workflow_dispatch. Proved by execution in an
              # adversarial review. This commit's own premise is that "the absence
              # of a result must not be readable as a result"; a STALE result reads
              # as a current one, which is the same lie with a better disguise.
              VLOG_AGE_MIN=$(((  $(date +%s) - $(stat -c '%Y' "$VLOG" 2>/dev/null || echo 0) ) / 60))
              VERDICT_MAX_AGE_MIN="${VERDICT_MAX_AGE_MIN:-720}"
              echo "  sweep log written $VLOG_AGE_MIN min ago (verdict is refused past $VERDICT_MAX_AGE_MIN min)"
              echo "::group::Verify · 7-pipeline dry-run (never persists)"
              # Budget kept UNDER the 40 min `command_timeout` on purpose: this
              # step must always get to print its own conclusion rather than be
              # killed mid-tail, which is the failure it exists to prevent.
              WATCH_UNTIL=$(( $(date +%s) + 1800 ))
              SEEN=0
              while :; do
                TOTAL="$(wc -l <"$VLOG" 2>/dev/null || echo 0)"
                if [ "$TOTAL" -gt "$SEEN" ]; then
                  tail -n "+$((SEEN + 1))" "$VLOG" | head -n "$((TOTAL - SEEN))" | redact
                  SEEN="$TOTAL"
                fi
                RUNNING=0
                [ -n "${VPID:-}" ] && kill -0 "$VPID" 2>/dev/null && RUNNING=1
                [ "$RUNNING" -eq 0 ] && break
                [ "$(date +%s)" -ge "$WATCH_UNTIL" ] && break
                sleep 15
              done
              echo "::endgroup::"

              VERDICT="$(grep -E '^RESULT: [0-9]+/7' "$VLOG" | tail -1)"
              # Re-read the age AFTER the tail: a sweep that finished during the
              # watch window has just been written, and judging it on the age
              # measured before the wait would refuse a verdict minutes old.
              VLOG_AGE_MIN=$(((  $(date +%s) - $(stat -c '%Y' "$VLOG" 2>/dev/null || echo 0) ) / 60))
              if [ -n "$VERDICT" ] && [ "$VLOG_AGE_MIN" -gt "$VERDICT_MAX_AGE_MIN" ]; then
                echo "::error title=Stale verdict, refused::the newest sweep on this host finished $VLOG_AGE_MIN min ago (limit $VERDICT_MAX_AGE_MIN). Its verdict says nothing about the host TODAY. Run mode=verify to start a fresh one."
                echo "$VERDICT"
                exit 1
              fi
              if [ -n "$VERDICT" ]; then
                echo "$VERDICT"
                case "$VERDICT" in
                  "RESULT: 7/7 pass, 0/7 fail") exit 0 ;;
                  *)
                    echo "::error::the sweep finished with failures — read the per-pipeline verdicts above."
                    echo "A FAIL/skipped on every pipeline means no Claude account is signed in on the host."
                    exit 1
                    ;;
                esac
              fi
              if [ "$RUNNING" -eq 1 ]; then
                echo "::error title=Still running, no verdict yet::the sweep is alive (pid $VPID) and has not printed a verdict. This is NOT a worker failure — it is the ABSENCE of one. Re-run this workflow with mode=verify-status to read the rest; it will not start a second sweep."
                exit 1
              fi
              echo "::error title=Sweep died without a verdict::the process is gone and no RESULT line was written. The tail above is everything it produced."
              exit 1
            fi

            # =================================================================
            # CONVERGE — fast-forward the checkout, then install the wrappers
            # =================================================================
            echo "::group::Converge · git pull --ff-only"
            if [ "$HAS_CHECKOUT" -ne 1 ]; then
              echo "::error::there is no checkout at ~/worker to converge."
              echo "This is a first-install, not a drift. As root on the host:"
              echo "    sudo bash <repo>/ops/worker/install-worker-vps.sh"
              exit 1
            fi
            if [ "$DIRTY" -ne 0 ]; then
              echo "::error::the checkout has locally modified tracked files — refusing to pull over them."
              git -C "$WORKER_REPO" status --porcelain | grep -vE '^\?\?' | redact
              exit 1
            fi
            # `reset --hard FETCH_HEAD`, NOT `pull --ff-only`, and deliberately:
            #   * the checkout is a `--depth 1` clone (install-worker-vps.sh:147),
            #     so a fast-forward can be refused for lack of a common ancestor
            #     even when nothing has actually diverged ;
            #   * it is the operation the RUNBOOK already prescribes
            #     (ops/worker/RUNBOOK.md:356) — one procedure, not two ;
            #   * `reset --hard` does not touch UNTRACKED files, so `worker.env`
            #     (gitignored, 0600, possibly hand-rotated) and `logs/` survive.
            # The clean-tree guard above is what makes it safe: it is the only
            # thing standing between this and discarding a hand edit.
            BEFORE_SHA="$(git -C "$WORKER_REPO" rev-parse --short HEAD)"
            git -C "$WORKER_REPO" fetch --quiet origin main || { echo "::error::fetch failed"; exit 1; }
            if ! git -C "$WORKER_REPO" reset --hard FETCH_HEAD 2>&1 | redact; then
              echo "::error::reset to origin/main failed."
              exit 1
            fi
            AFTER_SHA="$(git -C "$WORKER_REPO" rev-parse --short HEAD)"
            ok "checkout $BEFORE_SHA → $AFTER_SHA"
            # Prove worker.env survived. If this ever fails, every pipeline is
            # about to start failing auth and the operator must know NOW, not at
            # the next tick.
            [ -r "$WORKER_ENV" ] && ok "worker.env still present after the reset" \
                                 || bad "worker.env DISAPPEARED — re-run the installer with --refresh-env"
            # Re-prove the invariant the installer checks: the seven batch scripts.
            MISSING=0
            for s in onboarding verification seances calendar weekly monthly member-profile-monthly; do
              [ -f "$WORKER_REPO/ops/scripts/${s}-batch-local.sh" ] || \
              [ -f "$WORKER_REPO/ops/scripts/${s}-local.sh" ] || { bad "batch script for '$s' missing after pull"; MISSING=1; }
            done
            [ "$MISSING" -eq 0 ] && ok "7/7 batch scripts present after the pull"
            echo "::endgroup::"

            echo "::group::Converge · wrappers (needs root)"
            # Re-measure the drift AFTER the pull — the pull is what changes it.
            POST_DRIFT=0
            for pair in "ops/cron/fxmily-worker:$BIN_WORKER" \
                        "ops/cron/fxmily-worker-watchdog:$BIN_WATCHDOG"; do
              SRC="$WORKER_REPO/${pair%%:*}"; DST="${pair##*:}"
              cmp -s "$SRC" "$DST" 2>/dev/null || POST_DRIFT=1
            done

            if [ "$POST_DRIFT" -eq 0 ]; then
              ok "both wrappers already match the checkout — nothing to install."
              echo "::endgroup::"
              echo "RESULT: converged."
              exit "$FAILED"
            fi

            warn "wrappers differ from the checkout — the installer must run as root."
            # `sudo -n` never prompts. This PROBES the grant instead of assuming it.
            if sudo -n true 2>/dev/null; then
              echo "  passwordless sudo available — running the installer."
              sudo -n bash "$WORKER_REPO/ops/worker/install-worker-vps.sh" 2>&1 | redact
              INST_RC="${PIPESTATUS[0]}"
              echo "::endgroup::"
              [ "$INST_RC" -eq 0 ] && { echo "RESULT: converged and verified."; exit 0; }
              echo "::error::the installer exited $INST_RC."
              exit "$INST_RC"
            fi

            echo "::endgroup::"
            echo "::error title=Root gesture required::the deploy user's sudoers grant is limited to fxmily-sync-cron, so this workflow cannot install the wrappers."
            echo
            echo "The checkout IS now up to date — only the two root-owned wrappers remain."
            echo "One command, as root on the host:"
            echo
            echo "    sudo bash /home/fxmily/worker/ops/worker/install-worker-vps.sh"
            echo
            echo "It is idempotent, it never touches /etc/cron.d/fxmily-app, and it"
            echo "re-runs every check above. Then re-run this workflow in mode=inspect"
            echo "to prove the drift is closed."
            exit 1
